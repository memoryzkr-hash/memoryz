<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>블라인더 15초 소개 영상</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  /* 1. 첫 장면: 큰 그림 카드 */
  #hookCard { left: 88px; top: 700px; width: 904px; height: 640px; }
  #hookCard .fig { position: absolute; left: 32px; top: 50px; width: 840px; }

  /* 2. PDF 한 쪽 */
  #paper { left: 170px; top: 690px; width: 740px; height: 820px; background: #fff; border: 2px solid var(--line); border-radius: 20px; }
  .ln { position: absolute; height: 16px; border-radius: 8px; background: #E4E4E8; }
  .ln.t { height: 26px; background: #D3D4D9; }
  .figbox { position: absolute; }
  .figbox .ring { position: absolute; inset: -14px; border: 6px solid var(--accent); border-radius: 18px; opacity: 0; }
  .figbox .check { position: absolute; right: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; opacity: 0; }

  /* 3. 폰 화면 */
  #phone { left: 140px; top: 640px; width: 800px; height: 1400px; border: 14px solid var(--ink); border-radius: 100px; background: var(--bg); overflow: hidden; }
  #phone .bar-title { position: absolute; left: 0; right: 0; top: 56px; text-align: center; font-size: 38px; font-weight: 600; }
  #phone .back { position: absolute; left: 44px; top: 58px; }
  #phone .track { position: absolute; left: 48px; right: 48px; top: 140px; height: 8px; border-radius: 4px; background: #E4E4E8; }
  #phone .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
  #phone .count { position: absolute; right: 48px; top: 164px; font-size: 30px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #studyCard { left: 40px; top: 214px; width: 692px; height: 530px; border-radius: 40px; }
  #studyCard .cap { position: absolute; left: 40px; top: 34px; font-size: 30px; color: var(--muted); }
  #studyCard .fig { position: absolute; left: 22px; top: 88px; width: 648px; }
  #answerBtn { left: 40px; top: 770px; width: 692px; height: 110px; font-size: 40px; }

  /* 4. 복습 날짜 */
  #rateCard { left: 88px; top: 780px; width: 904px; height: 620px; }
  #rateCard .q { position: absolute; left: 56px; top: 56px; font-size: 44px; font-weight: 600; }
  .rate { top: 150px; width: 180px; height: 96px; font-size: 36px; }
  #rateCard .axis { position: absolute; left: 72px; width: 760px; top: 372px; height: 4px; background: var(--line); border-radius: 2px; }
  .tick { position: absolute; top: 360px; width: 4px; height: 28px; margin-left: -2px; background: #D3D4D9; border-radius: 2px; }
  .tlab { position: absolute; top: 404px; width: 120px; margin-left: -60px; text-align: center; font-size: 30px; color: var(--muted); }
  #marker { position: absolute; top: 340px; width: 16px; height: 68px; margin-left: -8px; border-radius: 8px; background: var(--accent); }
  #nextTxt { position: absolute; left: 56px; top: 490px; font-size: 48px; font-weight: 600; }
  #nextTxt b { color: var(--accent); font-weight: 600; }

  /* 5. 마무리 */
  #end { text-align: center; }
  #end .logo { position: absolute; left: 330px; top: 470px; width: 420px; height: 420px; }
  #end .name { position: absolute; left: 0; right: 0; top: 860px; font-size: 140px; font-weight: 700; letter-spacing: -0.02em; }
  #end .line1 { position: absolute; left: 0; right: 0; top: 1060px; font-size: 48px; color: var(--sub); }
  #end .cta { position: absolute; left: 0; right: 0; top: 1220px; font-size: 38px; color: var(--muted); }
  #end .url { left: 140px; width: 800px; top: 1290px; height: 104px; font-size: 38px; font-weight: 600; }
</style>
</head>
<body>
<div id="stage">

  <!-- 1. 첫 장면 -->
  <div class="layer" id="sA">
    <div class="head" id="hA">
      <div class="kicker">블라인더</div>
      <div class="title">외울 이름표만<br>가려 드려요</div>
    </div>
    <div class="card" id="hookCard"><div class="fig" id="figHook"></div></div>
  </div>

  <!-- 2. PDF에서 그림 찾기 -->
  <div class="layer" id="sB">
    <div class="head">
      <div class="kicker">PDF 그대로</div>
      <div class="title">교재를 넣으면<br>그림만 골라 줘요</div>
      <div class="body" style="position:relative;height:63px">
        <span class="abs" id="bBody1">그림 2개를 찾았어요</span>
        <span class="abs" id="bBody2">글은 그대로, 그림 이름표만 가려요</span>
      </div>
    </div>
    <div class="abs" id="paper">
      <div class="ln t" style="left:56px;top:56px;width:360px"></div>
      <div class="lines" id="lines"></div>
      <div class="figbox" id="fig1" style="left:40px;top:150px;width:400px">
        <div id="figPdfCell"></div>
        <div class="ring"></div><div class="check"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="figbox" id="fig2" style="left:370px;top:560px;width:330px">
        <div id="figPdfHeart"></div>
        <div class="ring"></div><div class="check"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
    </div>
  </div>

  <!-- 3. 눌러서 열기 -->
  <div class="layer" id="sC">
    <div class="head">
      <div class="kicker">가리고, 맞히고</div>
      <div class="title">누르면 열리고<br>다시 누르면 닫혀요</div>
    </div>
    <div class="abs" id="phone">
      <svg class="back" width="44" height="44" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="bar-title">생명과학_2장</div>
      <div class="track"><i style="width:16.7%"></i></div>
      <div class="count">1 / 6</div>
      <div class="card" id="studyCard"><div class="cap">이름표 가리기</div><div class="fig" id="figStudy"></div></div>
      <div class="pill black" id="answerBtn">정답 확인</div>
    </div>
  </div>

  <!-- 4. 복습 날짜 -->
  <div class="layer" id="sD">
    <div class="head">
      <div class="kicker">알아서 복습 일정</div>
      <div class="title">잊을 때쯤<br>다시 보여 줘요</div>
      <div class="body">쉬움 7일 · 보통 3일 · 어려움 1일</div>
    </div>
    <div class="card" id="rateCard">
      <div class="q">이 카드는 어땠나요?</div>
      <div class="pill line rate" style="left:56px">다시</div>
      <div class="pill line rate" style="left:252px">어려움</div>
      <div class="pill line rate" id="rNormal" style="left:448px">보통</div>
      <div class="pill line rate" id="rEasy" style="left:644px">쉬움</div>
      <div class="axis"></div>
      <div id="ticks"></div>
      <div id="marker"></div>
      <div id="nextTxt">다음 복습 <b id="nextDays">3일 뒤</b></div>
    </div>
  </div>

  <!-- 5. 마무리 -->
  <div class="layer" id="sE">
    <div id="end">
      <svg class="logo" viewBox="0 0 1024 1024">
        <rect x="297" y="212" width="430" height="560" rx="78" fill="#0A0A0A"/>
        <rect x="339" y="254" width="346" height="476" rx="40" fill="#FFFFFF"/>
        <rect x="380" y="320" width="232" height="34" rx="17" fill="#0A0A0A"/>
        <rect x="380" y="590" width="252" height="34" rx="17" fill="#0A0A0A"/>
        <rect x="380" y="650" width="172" height="34" rx="17" fill="#0A0A0A"/>
        <g id="logoBand" style="transform-box: fill-box; transform-origin: left center">
          <rect x="237" y="400" width="550" height="156" rx="34" fill="#F7F7F8"/>
          <rect x="255" y="418" width="514" height="120" rx="22" fill="#0A0A0A"/>
        </g>
      </svg>
      <div class="name">블라인더</div>
      <div class="line1">외울 그림만 가려 주는 플래시카드</div>
      <div class="cta">웹에서 바로 써 보기</div>
      <div class="pill line url">blinder-api.blinder-app.workers.dev</div>
    </div>
  </div>

  <div class="tap" id="tap"></div>
</div>

<script type="module">
import { start, prog, win, lerp, set, tap, easeOut } from "../shared/engine.js";
import { cellSVG, heartSVG, setLabel, CELL_COUNT, HEART_COUNT, CELL_BOXES } from "../shared/figures.js";

const $ = (s) => document.querySelector(s);
$("#figHook").innerHTML = cellSVG("hk");
$("#figPdfCell").innerHTML = cellSVG("pc");
$("#figPdfHeart").innerHTML = heartSVG("ph");
$("#figStudy").innerHTML = cellSVG("st");

// PDF 글줄
const LINES = [
  [480, 170, 200], [480, 206, 180], [480, 242, 204], [480, 278, 150], [480, 314, 196], [480, 350, 120],
  [56, 456, 628], [56, 492, 600], [56, 528, 420],
  [56, 596, 270], [56, 632, 250], [56, 668, 276], [56, 704, 230], [56, 740, 262], [56, 776, 160],
];
$("#lines").innerHTML = LINES.map(([x, y, w]) => `<div class="ln" style="left:${x}px;top:${y}px;width:${w}px"></div>`).join("");

// 복습 축: 0~7일
const AX0 = 72, AXW = 760, dayX = (d) => AX0 + (AXW * d) / 7;
$("#ticks").innerHTML = [0, 1, 3, 7]
  .map((d) => `<div class="tick" style="left:${dayX(d)}px"></div><div class="tlab" style="left:${dayX(d)}px">${d === 0 ? "오늘" : d + "일"}</div>`)
  .join("");

// 공부 화면에서 누를 자리(무대 좌표)
const ST = { x: 140 + 14 + 40 + 22, y: 640 + 14 + 214 + 88, k: 648 / 660 };
const boxCenter = (i) => {
  const [x, y, w, h] = CELL_BOXES[i];
  return [ST.x + (x + w / 2) * ST.k, ST.y + (y + h / 2) * ST.k];
};
const TAP_CHLORO = boxCenter(2), TAP_VAC = boxCenter(3);
const TAP_BTN = [540, 640 + 14 + 770 + 55];
const RATE_Y = 780 + 150 + 48;
const TAP_NORMAL = [88 + 448 + 90, RATE_Y], TAP_EASY = [88 + 644 + 90, RATE_Y];

const D = 15;

function render(t) {
  const sA = $("#sA"), sB = $("#sB"), sC = $("#sC"), sD = $("#sD"), sE = $("#sE");

  // ── 1. 첫 장면 (0 ~ 1.45초, 끝에서 다시 돌아옴)
  const aCard = t < 7 ? 1 - prog(t, 1.2, 1.45) : prog(t, 14.62, 15);
  sA.style.opacity = 1;
  $("#hookCard").style.opacity = aCard;
  $("#hA").style.opacity = win(t, 0.35, 1.45, 0.25);
  $("#hA").style.transform = `translateY(${lerp(16, 0, prog(t, 0.35, 0.6))}px)`;
  for (let i = 0; i < CELL_COUNT; i++) {
    const a = 0.12 + i * 0.13;
    setLabel(sA, "hk", i, t < 7 ? prog(t, a, a + 0.22, easeOut) : 0);
  }

  // ── 2. PDF (1.4 ~ 5.0초)
  sB.style.opacity = win(t, 1.4, 5.0, 0.3);
  $("#paper").style.transform = `translateY(${lerp(40, 0, prog(t, 1.4, 1.8))}px)`;
  $("#lines").style.opacity = lerp(1, 0.35, prog(t, 2.2, 2.6));
  [["#fig1", 2.3], ["#fig2", 2.65]].forEach(([s, a]) => {
    const p = prog(t, a, a + 0.3);
    set($(s + " .ring"), { opacity: p, transform: `scale(${lerp(1.05, 1, p)})` });
    set($(s + " .check"), { opacity: p, transform: `scale(${lerp(0.6, 1, easeOut((t - a) / 0.3))})` });
  });
  $("#bBody1").style.opacity = win(t, 2.9, 3.75, 0.2);
  $("#bBody2").style.opacity = prog(t, 3.75, 3.95);
  for (let i = 0; i < CELL_COUNT; i++) setLabel(sB, "pc", i, prog(t, 3.8 + i * 0.08, 4.0 + i * 0.08, easeOut));
  for (let i = 0; i < HEART_COUNT; i++) setLabel(sB, "ph", i, prog(t, 4.1 + i * 0.08, 4.3 + i * 0.08, easeOut));

  // ── 3. 눌러서 열기 (4.95 ~ 10.0초)
  sC.style.opacity = win(t, 4.95, 10.0, 0.3);
  $("#phone").style.transform = `translateY(${lerp(40, 0, prog(t, 4.95, 5.35))}px)`;
  const all = prog(t, 8.75, 9.0);
  for (let i = 0; i < CELL_COUNT; i++) {
    let open = all;
    if (i === 2) open = Math.max(all, prog(t, 5.95, 6.15) - prog(t, 7.75, 7.95)); // 엽록체: 열었다가 다시 닫기
    if (i === 3) open = Math.max(all, prog(t, 6.85, 7.05)); // 액포
    setLabel(sC, "st", i, 1 - open, open);
  }
  $("#answerBtn").style.transform = `scale(${1 - 0.03 * win(t, 8.55, 8.85, 0.12)})`;

  // ── 4. 복습 날짜 (9.95 ~ 13.0초)
  sD.style.opacity = win(t, 9.95, 13.0, 0.3);
  $("#rateCard").style.transform = `translateY(${lerp(40, 0, prog(t, 9.95, 10.35))}px)`;
  const pickN = prog(t, 10.95, 11.1) - prog(t, 12.15, 12.3);
  const pickE = prog(t, 12.15, 12.3);
  [[$("#rNormal"), pickN], [$("#rEasy"), pickE]].forEach(([el, p]) => {
    set(el, { background: p > 0.5 ? "#3D33D8" : "#fff", color: p > 0.5 ? "#fff" : "#0A0A0A", borderColor: p > 0.5 ? "#3D33D8" : "#ECECEE" });
  });
  const days = lerp(0, 3, prog(t, 11.1, 11.6)) + lerp(0, 4, prog(t, 12.3, 12.8));
  $("#marker").style.left = dayX(days) + "px";
  $("#nextDays").textContent = (t < 12.3 ? 3 : 7) + "일 뒤";
  $("#nextTxt").style.opacity = prog(t, 11.45, 11.7);

  // ── 5. 마무리 (12.95 ~ 14.85초)
  sE.style.opacity = win(t, 12.95, 14.7, 0.3);
  $("#logoBand").style.transform = `scaleX(${prog(t, 13.15, 13.55, easeOut)})`;
  $("#end").style.transform = `translateY(${lerp(24, 0, prog(t, 12.95, 13.35))}px)`;

  // ── 누른 자리
  const tapEl = $("#tap");
  const taps = [
    [5.9, ...TAP_CHLORO], [6.8, ...TAP_VAC], [7.7, ...TAP_CHLORO], [8.5, ...TAP_BTN],
    [10.9, ...TAP_NORMAL], [12.1, ...TAP_EASY],
  ];
  tapEl.style.opacity = 0;
  for (const [at, x, y] of taps) if (t >= at && t <= at + 0.4) tap(tapEl, t, at, x, y);
}

start({ duration: D, render });
</script>
</body>
</html>
