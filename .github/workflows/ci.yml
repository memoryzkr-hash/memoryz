name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 매일 오전 6시(한국 시간)에 다시 빌드해서 주간보호센터 랜딩페이지에 블로그 새 글을 반영합니다.
    - cron: '0 21 * * *'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # 네이버 블로그 최신 글을 dist/daycare/posts.json으로 받습니다. 실패해도 사이트 배포는 막지 않습니다.
      - run: node scripts/fetch-blog.mjs dist/daycare
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'schedule' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request')
        with:
          path: dist

  deploy:
    # Publishes the game at https://<owner>.github.io/<repo>/ after a push to the default branch.
    # Needs Settings → Pages → Source set to "GitHub Actions" once; until then this job fails
    # without turning the whole run red.
    if: github.event_name == 'schedule' || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request')
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
